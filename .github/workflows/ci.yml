name: CI/CD Pipeline

on:
  push:
    branches: [ dev, main ]

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      REGISTRY: 172.236.254.239:30880
      IMAGE_NAME: supermodel
      FEISHU_WEBHOOK: https://open.feishu.cn/open-apis/bot/v2/hook/f5863f4d-4f8f-41e6-8361-ee3a16672099

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract branch name
        shell: bash
        run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - name: Get short SHA
        shell: bash
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Create BuildKit config for insecure HTTP Harbor
        shell: bash
        run: |
          mkdir -p /tmp/buildkit
          printf '[registry."172.236.254.239:30880"]\n  http = true\n  insecure = true\n' > /tmp/buildkit/buildkitd.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-config: /tmp/buildkit/buildkitd.toml

      - name: Login to Harbor
        shell: bash
        run: |
          mkdir -p ~/.docker
          AUTH=$(echo -n "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" | base64 -w 0)
          printf '{"auths":{"172.236.254.239:30880":{"auth":"%s"}}}\n' "${AUTH}" > ~/.docker/config.json

      # ── dev 分支：构建测试镜像，更新 k8s/dev ──────────────────────────────
      - name: Build and push dev image
        id: build_dev
        if: env.BRANCH_NAME == 'dev'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: |
            172.236.254.239:30880/supermodel/supermodel:dev-${{ env.SHORT_SHA }}
            172.236.254.239:30880/supermodel/supermodel:dev-latest
          build-args: |
            NODE_ENV=development

      - name: Update k8s/dev/deployment.yaml
        if: env.BRANCH_NAME == 'dev' && steps.build_dev.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          FILE="k8s/dev/deployment.yaml"
          NEW_IMG="${REGISTRY}/${IMAGE_NAME}/${IMAGE_NAME}:dev-${SHORT_SHA}"
          sed -i -E "s|image:.*${IMAGE_NAME}.*:dev-[a-z0-9]+|image: ${NEW_IMG}|g" "$FILE"
          if git diff --quiet -- "$FILE"; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore(ci): update dev image to dev-${SHORT_SHA} [skip ci]"
          git push origin HEAD:dev

      # ── main 分支：构建生产镜像，更新 k8s/prod ───────────────────────────
      - name: Build and push prod image
        id: build_prod
        if: env.BRANCH_NAME == 'main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: |
            172.236.254.239:30880/supermodel/supermodel:prod-${{ env.SHORT_SHA }}
            172.236.254.239:30880/supermodel/supermodel:prod-latest
          build-args: |
            NODE_ENV=production

      - name: Update k8s/prod/deployment.yaml
        if: env.BRANCH_NAME == 'main' && steps.build_prod.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          FILE="k8s/prod/deployment.yaml"
          NEW_IMG="${REGISTRY}/${IMAGE_NAME}/${IMAGE_NAME}:prod-${SHORT_SHA}"
          sed -i -E "s|image:.*${IMAGE_NAME}.*:prod-[a-z0-9]+|image: ${NEW_IMG}|g" "$FILE"
          if git diff --quiet -- "$FILE"; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore(ci): update prod image to prod-${SHORT_SHA} [skip ci]"
          git push origin HEAD:main

      - name: Notify Feishu on success
        if: success()
        shell: bash
        run: |
          curl -sS -X POST "${FEISHU_WEBHOOK}" \
            -H 'Content-Type: application/json' \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"✅ [SuperModel] ${BRANCH_NAME} build success | ${SHORT_SHA}\"}}"

      - name: Notify Feishu on failure
        if: failure()
        shell: bash
        run: |
          curl -sS -X POST "${FEISHU_WEBHOOK}" \
            -H 'Content-Type: application/json' \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"❌ [SuperModel] ${BRANCH_NAME} build failed | ${SHORT_SHA} | https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}}"
