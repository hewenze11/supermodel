id: get_recent_meta
name: get_recent_meta
description: "获取最近记忆的元数据（只返回 id/tags/session_id/created_at，不返回全文，用于调度器分配任务）"
method: POST
endpoint: "http://memcore-api.dev-memcore.svc.cluster.local:3000/memory/recall"
headers:
  Authorization: "Bearer ${X_USER_TOKEN}"
  Content-Type: "application/json"
  X-Product-ID: "memory-spider"
body:
  query: "${input}"
  limit: 100
  meta_only: true
