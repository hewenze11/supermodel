id: recall
description: "召回流程：对话前执行，从记忆系统召回相关记忆注入上下文"
output_node: recall_node
max_rounds: 1
timeout_seconds: 30

nodes:
  - id: recall_node
    type: serial
    role_id: recall
    timeout_seconds: 30
    tools:
      - recall_merge
    prompt: |
      根据用户消息，执行记忆召回：
      
      第一步（必须）：分析用户消息，提取 1-3 个核心关键词，调用 recall_merge 工具一次。
      
      第二步：整合所有召回结果，结合已注入的 L4 核心文档和近期对话，按以下格式输出：
      
      ---
      【长期记忆（核心文档）】
      {L4核心文档内容，已在上下文中，直接引用}
      
      【近期对话】
      {已注入的近期 L1/L2，按时间倒序}
      
      【检索到的相关记忆】
      {recall_merge 返回的相关片段，按 score 排序}
      ---
      
      规则：
      - recall_merge 只调用一次，禁止重复调用
      - 无相关结果时对应区块写"暂无"
      - 直接输出上下文，不要解释过程