id: recall
description: "召回流程：对话前执行，从记忆系统召回相关记忆注入上下文"
output_node: recall_node
max_rounds: 15
timeout_seconds: 60

nodes:
  - id: recall_node
    type: serial
    role_id: recall
    timeout_seconds: 60
    tools:
      - get_recent
      - search_memory
      - recall_by_day
      - recall_by_time
      - search_by_topic
      - context_stage_create
    prompt: |
      上面是用户当前发送的消息。
      请严格按角色说明中的三步流程执行记忆召回，输出完整的"记忆上下文"。
