id: recall
description: "召回流程：对话前执行，从记忆系统召回相关记忆注入上下文"
output_node: recall_node
max_rounds: 1
timeout_seconds: 30

nodes:
  - id: recall_node
    type: serial
    role_id: recall
    timeout_seconds: 30
    tools:
      - recall_merge
    prompt: |
      上下文中已经预注入了：
      - [L4 核心文档]：用户的长期核心认知
      - [最近对话 L1]：最近 5 轮原始对话
      - [第 6-15 轮摘要 L2]：中期对话摘要
      
      你的任务是判断是否需要深度召回，然后整合输出记忆上下文。
      
      【判断规则 - 必须严格执行】
      
      ✅ 直接输出（不调工具）的情况 - 满足以下任一条件：
      1. 用户这轮消息是对最近几轮对话的延续（同一话题继续）
      2. 用户消息简短且无特定事件/人名/项目指向（如：打招呼、简单问答、测试）
      3. 预注入的近期对话中已经包含了足够回答用户的信息
      
      🔍 需要调用 recall_merge 一次的情况 - 必须同时满足：
      1. 用户消息中出现时间跳跃词：以前、上次、之前、曾经、那时、记得吗、有没有说过、历史上、当初等
         或者用户明确问"我有没有说过/做过 xxx"
      2. 并且：预注入的近期对话里找不到相关信息
      
      【执行步骤】
      
      第一步：对照上面的判断规则，决定走哪条路径。
      
      第二步A（不需要深度召回）：直接整合预注入数据，按格式输出。
      
      第二步B（需要深度召回）：提取 1-3 个关键词，调用 recall_merge 一次，再整合输出。
      
      【输出格式】
      ---
      【长期记忆（核心文档）】
      {L4核心文档内容，已在上下文中直接引用；无则写"暂无"}
      
      【近期对话】
      {已注入的近期 L1/L2，按时间倒序；无则写"暂无"}
      
      【检索到的相关记忆】
      {深度召回结果；未触发深度召回则写"本轮无需深度召回"}
      ---
      
      规则：
      - recall_merge 最多调用一次，禁止重复调用
      - 直接输出上下文，不要解释判断过程