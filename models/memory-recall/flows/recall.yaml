id: recall
description: "召回流程：对话前执行，从记忆系统召回相关记忆注入上下文"
output_node: recall_node
max_rounds: 15
timeout_seconds: 60

nodes:
  - id: recall_node
    type: serial
    role_id: recall
    timeout_seconds: 60
    tools:
      - get_recent
      - search_memory
      - recall_by_day
      - recall_by_time
      - search_by_topic
    prompt: |
      根据上面用户消息，执行记忆召回：
      1. 强制调用 get_recent 加载最近上下文（必须执行，不可跳过）
      2. 分析用户消息，判断是否需要额外检索
      3. 如需要，调用对应检索工具（可组合多个）
      4. 整合所有召回结果，按以下格式输出：
      
      ---
      【长期记忆（核心文档）】
      {L4文档内容，按文档标题分段}
      
      【近期对话】
      {最近的L1/L2内容，按时间倒序}
      
      【检索到的相关记忆】
      {额外检索结果，如有}
      ---
