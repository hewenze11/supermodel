id: archive
description: "归档流程：算力模型返回结果后异步执行，将本轮对话写入记忆系统"
output_node: archive_node
max_rounds: 15
timeout_seconds: 120

nodes:
  - id: archive_node
    type: serial
    role_id: crawler
    timeout_seconds: 120
    tools:
      - ingest_message
      - list_topics
      - archive_summary
      - list_docs
      - update_doc
      - upsert_doc
    prompt: |
      本轮对话内容如下，请执行归档：

      用户消息：
      {{user_message}}

      算力模型回复：
      {{assistant_message}}

      session_id：{{session_id}}

      请严格按角色说明中的五步流程执行，不可跳步，不可遗漏工具调用。
