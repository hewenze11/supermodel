id: archive
description: "归档流程：算力模型返回结果后异步执行，将本轮对话写入记忆系统"
output_node: archive_node
max_rounds: 10
timeout_seconds: 120

nodes:
  - id: archive_node
    type: serial
    role_id: crawler
    timeout_seconds: 120
    tools:
      - list_topics
      - get_tags
      - ingest_message
      - archive_summary
    prompt: |
      请归档上面的对话内容（user 消息和 assistant 消息均在输入中）。
      请严格按以下步骤执行（每步都必须实际调用工具，不可只描述）：
      1. 调用 list_topics 查看已有话题
      2. 调用 get_tags 查看用户标签库
      3. 从对话中提取 user 消息内容，调用 ingest_message 写入（role=user）
      4. 从对话中提取 assistant 消息内容，调用 ingest_message 写入（role=assistant），保存返回的 id
      5. 生成本轮对话摘要（100-500字，含核心内容+结论+重要实体）
      6. 决定话题名称（参考已有话题，优先复用；连续对话共用话题）
      7. 从标签库中选择合适的标签（没有合适的传空数组）
      8. 调用 archive_summary 完成归档（传入步骤4的 assistant message id、摘要、话题名、标签）
      
      完成后输出："归档完成"即可。
