id: archive
description: "归档流程：算力模型返回结果后异步执行，将本轮对话写入记忆系统"
output_node: archive_node
max_rounds: 15
timeout_seconds: 120

nodes:
  - id: archive_node
    type: serial
    role_id: crawler
    timeout_seconds: 120
    tools:
      - ingest_message
      - list_topics
      - archive_summary
      - list_docs
      - update_doc
      - upsert_doc
    prompt: |
      上面是本轮完整对话内容（包含用户消息和算力模型的回复）。
      请严格按角色说明中的五步流程执行归档，不可跳步，不可遗漏工具调用。
      session_id 请从对话内容中识别，若未提及则使用 "default-session"。
