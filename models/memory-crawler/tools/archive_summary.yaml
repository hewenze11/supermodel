id: archive_summary
name: "归档摘要"
description: "归档本轮对话到记忆系统。传入 session_id，服务端自动将该 session 的所有消息归档为 L2 摘要。必须在两次 ingest_message 完成后调用。"
endpoint: "http://memcore-api.dev-memcore.svc.cluster.local:3000/memory/archive"
method: POST
timeout_seconds: 30
headers:
  Content-Type: "application/json"
parameters:
  type: object
  required: [session_id]
  properties:
    session_id:
      type: string
      description: "会话ID，与 ingest_message 传入的 session_id 一致"
