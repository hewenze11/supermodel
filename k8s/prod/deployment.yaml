apiVersion: apps/v1
kind: Deployment
metadata:
  name: supermodel-prod
  namespace: supermodel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: supermodel-prod
  template:
    metadata:
      labels:
        app: supermodel-prod
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
      - name: supermodel
        image: 172.236.254.239:30880/supermodel/supermodel:prod-6f78fe4
        imagePullPolicy: Always
        ports:
        - containerPort: 11451
          name: inference
        - containerPort: 11435
          name: admin
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          value: "postgresql://postgres:PgProd12345@172.236.224.19:5432/supermodel_prod"
        - name: REDIS_URL
          value: "redis://:RedisProd12345@172.236.224.19:6379"
        - name: MEMORY_API_BASE_URL
          value: "http://memory-spider-api.memory-spider.svc.cluster.local:3001"
        - name: MEMCORE_BASE_URL
          value: "http://memcore-api.memcore.svc.cluster.local:3000"
        - name: APIMART_API_KEY
          valueFrom:
            secretKeyRef:
              name: supermodel-secrets
              key: APIMART_API_KEY
        - name: SUPERMODEL_API_KEYS
          valueFrom:
            secretKeyRef:
              name: supermodel-secrets
              key: SUPERMODEL_API_KEYS
        livenessProbe:
          httpGet:
            path: /health
            port: 11451
            httpHeaders:
            - name: Authorization
              value: "Bearer sm-memory-spider-prod-2026"
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 11451
            httpHeaders:
            - name: Authorization
              value: "Bearer sm-memory-spider-prod-2026"
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
        volumeMounts:
        - name: supermodel-config
          mountPath: /home/supermodel/.supermodel
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: supermodel-config
        hostPath:
          path: /root/.supermodel
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: supermodel-service-prod
  namespace: supermodel
spec:
  selector:
    app: supermodel-prod
  ports:
    - protocol: TCP
      port: 11451
      targetPort: 11451
      name: inference
    - protocol: TCP
      port: 11435
      targetPort: 11435
      name: admin
  type: ClusterIP
